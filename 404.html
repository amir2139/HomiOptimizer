<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06060d">
  <meta name="robots" content="noindex">
  <title>صفحه پیدا نشد | هومی‌اپتیمایزر</title>
  <link rel="icon" href="assets/img/icon-32.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap">
  <style>
    html,body{height:100%}
    body{margin:0;background:#06060d;color:#eceefb;font-family:"Vazirmatn",system-ui,sans-serif;
      display:grid;place-items:center;text-align:center;padding:24px}
    .box{max-width:460px}
    img{width:72px;height:72px;margin:0 auto 18px}
    h1{font-size:72px;font-weight:800;margin:0;background:linear-gradient(135deg,#7c83ff,#4338ca);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#9aa3c7;margin:10px 0 26px}
    a{display:inline-block;background:linear-gradient(135deg,#7c83ff,#4338ca);color:#fff;font-weight:700;
      padding:13px 26px;border-radius:13px;text-decoration:none}
  </style>
</head>
<body>
  <div class="box">
    <img src="assets/img/logo.svg" alt="هومی‌اپتیمایزر">
    <h1>۴۰۴</h1>
    <p>این صفحه پیدا نشد. شاید نشانی را اشتباه وارد کرده‌ای.</p>
    <a href="./">بازگشت به صفحه‌ی اصلی</a>
  </div>
</body>
</html>
